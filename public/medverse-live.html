    function showToast(msg, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const el = document.createElement('div');
      const colors = type === 'error' ? 'bg-rose-950/95 border-rose-500/50 text-rose-100'
        : type === 'success' ? 'bg-teal-950/95 border-teal-400/50 text-teal-100'
        : 'bg-navy-800/95 border-cyan-400/40 text-cyan-100';
      el.className = `pointer-events-auto px-4 py-2.5 rounded-xl border text-xs sm:text-sm shadow-xl ${colors}`;
      el.textContent = msg;
      container.appendChild(el);
      setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 0.25s ease'; setTimeout(() => el.remove(), 260); }, 3200);
    }

    // ---------- 9. PHASE 02 MULTI-LAYER 3D ANATOMY ENGINE ----------
    class MedverseAnatomyViewer {
      constructor(containerEl, options = {}) {
        this.container = containerEl;
        this.isHero = Boolean(options.isHero);
        this.sceneMode = options.sceneMode || 'body';
        this.onSelect = options.onSelect || null;
        this.labelOverlay = options.labelOverlay || null;
        this.orientationBadgeEl = options.orientationBadgeEl || null;
        this.disposed = false;
        this.animFrameId = null;
        this.clock = new THREE.Clock();

        this.selectableMeshes = [];
        this.structureGroups = {};
        this.layerGroups = {};
        this.importedRoot = null;
        this.selectedId = options.initialSelectedId || 'heart';

        // Clipping planes (Geometric Cutaways: Axial Y, Coronal Z, Sagittal X)
        this.clipPlanes = {
          axial: new THREE.Plane(new THREE.Vector3(0, -1, 0), 3.6),
          coronal: new THREE.Plane(new THREE.Vector3(0, 0, -1), 1.5),
          sagittal: new THREE.Plane(new THREE.Vector3(-1, 0, 0), 1.8)
        };

        // Camera spherical orbit
        this.target = new THREE.Vector3(0, this.sceneMode === 'body' ? 0.72 : 0.1, 0);
        this.spherical = { radius: this.sceneMode === 'body' ? (this.isHero ? 9.4 : 8.8) : 5.2, theta: 0.28, phi: 1.48 };
        this.desiredSpherical = { ...this.spherical };
        this.desiredTarget = this.target.clone();
        this.isDragging = false;
        this.dragMode = 'orbit';
        this.lastPointer = { x: 0, y: 0 };
        this.pointerDownPos = { x: 0, y: 0 };
        this.lastTapTime = 0;
        this.activeTouches = new Map();
        this.lastPinchDist = null;

        this.init();
      }

      getQualityPixelRatio() {
        const dpr = window.devicePixelRatio || 1;
        const q = state.viewerSettings.quality;
        if (q === 'low') return 1;
        if (q === 'medium') return Math.min(dpr, 1.5);
        if (q === 'high') return Math.min(dpr, 2.25);
        return Math.min(dpr, window.innerWidth < 768 ? 1.5 : 2);
      }

      init() {
        if (typeof THREE === 'undefined') {
          this.showError('WebGL / Three.js library unavailable.');
          return;
        }
        try {
          const rect = this.container.getBoundingClientRect();
          const width = Math.max(Math.round(rect.width), 300);
          const height = Math.max(Math.round(rect.height), 260);

          this.scene = new THREE.Scene();
          this.applyBackground(state.viewerSettings.bgPreset);

          this.camera = new THREE.PerspectiveCamera(40, width / height, 0.1, 100);
          this.updateCameraFromSpherical();

          this.renderer = new THREE.WebGLRenderer({ antialias: state.viewerSettings.quality !== 'low', alpha: false, powerPreference: 'high-performance' });
          this.renderer.setPixelRatio(this.getQualityPixelRatio());
          this.renderer.setSize(width, height, false);
          this.renderer.localClippingEnabled = true;
          this.renderer.domElement.style.width = '100%';
          this.renderer.domElement.style.height = '100%';
          this.renderer.domElement.style.display = 'block';
          this.renderer.outputEncoding = THREE.sRGBEncoding;
          this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
          this.renderer.toneMappingExposure = 1.06;

          this.container.innerHTML = '';
          this.container.appendChild(this.renderer.domElement);
          if (typeof ResizeObserver !== 'undefined') {
            this._resizeObserver = new ResizeObserver(() => this.resize());
            this._resizeObserver.observe(this.container);
          }
          setTimeout(() => this.resize(), 120);

          this.setupLights();
          this.buildSceneContent();
          this.applyLighting(state.viewerSettings.lightingPreset, state.viewerSettings.lightIntensity);
          this.applyAllVisualStates();

          this.raycaster = new THREE.Raycaster();
          this.mouse = new THREE.Vector2();

          this.bindEvents();
          this.animate();
        } catch (err) {
          console.error('3D Viewer init error:', err);
          this.showError('WebGL rendering is unavailable on this device.');
        }
      }

      showError(msg) {
        this.container.innerHTML = `
          <div class="w-full h-full flex flex-col items-center justify-center p-6 text-center bg-navy-900/90 text-slate-300">
            <div class="w-12 h-12 rounded-full bg-rose-500/15 border border-rose-500/30 flex items-center justify-center mb-3 text-rose-300 font-bold">!</div>
            <p class="text-sm font-medium text-white mb-1">${msg}</p>
            <p class="text-xs text-slate-400">All anatomical databases, bilingual panels, and terminology tools remain fully usable.</p>
          </div>`;
      }

      setupLights() {
        this.ambientLight = new THREE.AmbientLight(0xdbeafe, 0.58);
        this.keyLight = new THREE.DirectionalLight(0xffffff, 1.25);
        this.keyLight.position.set(5, 8, 7);
        this.rimLight = new THREE.DirectionalLight(0x22d3ee, 0.65);
        this.rimLight.position.set(-6, 4, -5);
        this.fillLight = new THREE.PointLight(0x38bdf8, 0.4, 24);
        this.fillLight.position.set(0, -3, 5);
        this.scene.add(this.ambientLight, this.keyLight, this.rimLight, this.fillLight);

        const ring = new THREE.Mesh(
          new THREE.RingGeometry(2.05, 2.12, 64),
          new THREE.MeshBasicMaterial({ color: 0x22d3ee, side: THREE.DoubleSide, transparent: true, opacity: 0.16 })
        );
        ring.rotation.x = Math.PI / 2;
        ring.position.y = this.sceneMode === 'body' ? -2.25 : -2.05;
        this.scene.add(ring);
      }

      makeMat(hex, roughness = 0.42, metalness = 0.08, opacity = 1, wireframe = false) {
        return new THREE.MeshStandardMaterial({
          color: hex,
          roughness,
          metalness,
          transparent: true,
          opacity,
          depthWrite: opacity >= 0.75,
          wireframe,
          side: opacity < 0.6 ? THREE.DoubleSide : THREE.FrontSide
        });
      }

      addToLayer(layerId, mesh, structureId = null, anchor = null) {
        if (!this.layerGroups[layerId]) {
          this.layerGroups[layerId] = new THREE.Group();
          this.layerGroups[layerId].name = layerId;
          this.rootGroup.add(this.layerGroups[layerId]);
        }
        mesh.userData.layerId = layerId;
        mesh.userData.baseOpacity = mesh.material.opacity;
        mesh.userData.baseEmissive = mesh.material.emissive ? mesh.material.emissive.clone() : new THREE.Color(0x000000);
        this.layerGroups[layerId].add(mesh);

        if (structureId) {
          mesh.userData.structureId = structureId;
          this.selectableMeshes.push(mesh);
          if (!this.structureGroups[structureId]) {
            this.structureGroups[structureId] = { meshes: [], anchor: anchor ? anchor.clone() : mesh.position.clone() };
          }
          this.structureGroups[structureId].meshes.push(mesh);
        }
      }

      buildSceneContent() {
        this.rootGroup = new THREE.Group();
        this.scene.add(this.rootGroup);
        this.selectableMeshes = [];
        this.structureGroups = {};
        this.layerGroups = {};

        if (this.sceneMode === 'heart') {
          this.buildDetailedHeartScene();
        } else {
          this.buildMultiLayerHumanBodyScene();
        }
      }

      applyAllVisualStates() {
        const activePlanes = [];
        if (state.clipping.axial.enabled) { this.clipPlanes.axial.constant = state.clipping.axial.value; activePlanes.push(this.clipPlanes.axial); }
        if (state.clipping.coronal.enabled) { this.clipPlanes.coronal.constant = state.clipping.coronal.value; activePlanes.push(this.clipPlanes.coronal); }
        if (state.clipping.sagittal.enabled) { this.clipPlanes.sagittal.constant = state.clipping.sagittal.value; activePlanes.push(this.clipPlanes.sagittal); }

        const selectedObj = ANATOMY_STRUCTURES.find(s => s.id === this.selectedId);
        const relatedSet = new Set(selectedObj ? [selectedObj.id, ...selectedObj.relatedIds] : [this.selectedId]);

        // Layer visibility & opacity + Isolation mode + Clipping planes
        Object.entries(this.layerGroups).forEach(([layerId, grp]) => {
          const layerCfg = state.layers.find(l => l.id === layerId);
          const layerVisible = layerCfg ? layerCfg.visible : true;
          const layerOpacity = layerCfg ? layerCfg.opacity : 1.0;

          grp.visible = layerVisible;
          grp.traverse(node => {
            if (!node.isMesh || !node.material) return;
            node.material.clippingPlanes = activePlanes;
            const sid = node.userData.structureId;

            if (state.isolationMode === 'isolate') {
              node.visible = sid === this.selectedId;
              node.material.opacity = sid === this.selectedId ? 1.0 : 0.0;
            } else if (state.isolationMode === 'related') {
              node.visible = Boolean(sid && relatedSet.has(sid));
              node.material.opacity = sid === this.selectedId ? 1.0 : 0.68;
            } else if (state.isolationMode === 'xray') {
              node.visible = layerVisible;
              node.material.opacity = sid === this.selectedId ? 1.0 : Math.min(layerOpacity, 0.14);
            } else {
              node.visible = layerVisible;
              node.material.opacity = layerId === 'layer-skin' ? layerOpacity : Math.min(1, layerOpacity);
              node.material.depthWrite = node.material.opacity >= 0.75;
            }

            if (node.material.emissive) {
              if (sid && sid === this.selectedId) {
                node.material.emissive.setHex(0x06b6d4);
                node.material.emissiveIntensity = 0.52;
              } else {
                node.material.emissive.setHex(0x000000);
                node.material.emissiveIntensity = 0.0;
              }
            }
          });
        });

        // Also handle Heart Detail Mode (where meshes are directly in heartPulseGroup)
        if (this.sceneMode === 'heart' && this.heartPulseGroup) {
          this.heartPulseGroup.traverse(node => {
            if (!node.isMesh || !node.material) return;
            node.material.clippingPlanes = activePlanes;
            const sid = node.userData.structureId;
            if (state.isolationMode === 'isolate') {
              node.visible = sid === this.selectedId;
              node.material.opacity = 1.0;
            } else if (state.isolationMode === 'related') {
              node.visible = relatedSet.has(sid);
              node.material.opacity = sid === this.selectedId ? 1.0 : 0.65;
            } else if (state.isolationMode === 'xray') {
              node.visible = true;
              node.material.opacity = sid === this.selectedId ? 1.0 : 0.15;
            } else {
              node.visible = true;
              node.material.opacity = node.userData.baseOpacity;
            }
            if (node.material.emissive) {
              node.material.emissive.setHex(sid === this.selectedId ? 0x06b6d4 : 0x000000);
              node.material.emissiveIntensity = sid === this.selectedId ? 0.55 : 0.0;
            }
          });
        }

        // Imported GLB layer 08
        if (this.importedRoot) {
          const l8 = state.layers.find(l => l.id === 'layer-additional');
          this.importedRoot.visible = l8 ? l8.visible : true;
          this.importedRoot.traverse(n => {
            if (n.isMesh && n.material) {
              n.material.clippingPlanes = activePlanes;
              n.material.transparent = true;
              n.material.opacity = l8 ? l8.opacity : 1.0;
            }
          });
        }
        this.update3DLabels();
      }

      highlightStructure(structureId, focusCamera = false) {
        this.selectedId = structureId;
        this.applyAllVisualStates();
        if (focusCamera) this.focusOnStructure(structureId);
      }

      focusOnStructure(structureId) {
        const s = ANATOMY_STRUCTURES.find(x => x.id === structureId);
        if (!s || !s.pos) return;
        this.desiredTarget.set(s.pos[0], s.pos[1], s.pos[2]);
        this.desiredSpherical.radius = s.focusRadius || 2.5;
      }

      setCameraPreset(preset) {
        const baseY = this.sceneMode === 'body' ? 0.72 : 0.1;
        const baseR = this.sceneMode === 'body' ? 8.8 : 5.2;
        this.desiredTarget.set(0, baseY, 0);
        if (preset === 'front') this.desiredSpherical = { radius: baseR, theta: 0, phi: Math.PI / 2 };
        else if (preset === 'rear') this.desiredSpherical = { radius: baseR, theta: Math.PI, phi: Math.PI / 2 };
        else if (preset === 'left') this.desiredSpherical = { radius: baseR, theta: Math.PI / 2, phi: Math.PI / 2 };
        else if (preset === 'right') this.desiredSpherical = { radius: baseR, theta: -Math.PI / 2, phi: Math.PI / 2 };
        else if (preset === 'superior') this.desiredSpherical = { radius: baseR, theta: 0, phi: 0.25 };
        else if (preset === 'inferior') this.desiredSpherical = { radius: baseR, theta: 0, phi: Math.PI - 0.25 };
        else this.desiredSpherical = { radius: baseR, theta: 0.28, phi: 1.46 };
      }

      applyLighting(preset, intensity) {
        if (!this.keyLight) return;
        const mult = Number(intensity) || 1.25;
        if (preset === 'warm') {
          this.ambientLight.color.setHex(0xffedd5); this.keyLight.color.setHex(0xfff7ed); this.keyLight.intensity = mult;
        } else if (preset === 'contrast') {
          this.ambientLight.color.setHex(0x94a3b8); this.keyLight.color.setHex(0xffffff); this.keyLight.intensity = mult * 1.25;
        } else {
          this.ambientLight.color.setHex(0xdbeafe); this.keyLight.color.setHex(0xf8fafc); this.keyLight.intensity = mult;
        }
      }

      applyBackground(preset) {
        if (!this.scene) return;
        const map = { navy: 0x061022, slate: 0x0f172a, obsidian: 0x030712, clinicalLight: 0xdbeafe };
        this.scene.background = new THREE.Color(map[preset] || 0x061022);
      }

      updateCameraFromSpherical() {
        const { radius, theta, phi } = this.spherical;
        const sinPhi = Math.sin(phi);
        this.camera.position.set(
          this.target.x + radius * sinPhi * Math.sin(theta),
          this.target.y + radius * Math.cos(phi),
          this.target.z + radius * sinPhi * Math.cos(theta)
        );
        this.camera.lookAt(this.target);
        this.updateOrientationWidget();
      }

      updateOrientationWidget() {
        if (!this.orientationBadgeEl) return;
        const tNorm = ((this.spherical.theta % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
        let dirEn = 'Anterior (Front)', dirAr = 'أمامي';
        if (this.spherical.phi < 0.55) { dirEn = 'Superior (Top)'; dirAr = 'علوي'; }
        else if (this.spherical.phi > Math.PI - 0.55) { dirEn = 'Inferior (Bottom)'; dirAr = 'سفلي'; }
        else if (tNorm > 2.35 && tNorm < 3.95) { dirEn = 'Posterior (Back)'; dirAr = 'خلفي'; }
        else if (tNorm >= 0.78 && tNorm <= 2.35) { dirEn = 'Anatomical Left (+X)'; dirAr = 'الجانب الأيسر التشريحي'; }
        else if (tNorm >= 3.95 && tNorm <= 5.5) { dirEn = 'Anatomical Right (-X)'; dirAr = 'الجانب الأيمن التشريحي'; }
        this.orientationBadgeEl.textContent = state.lang === 'ar' ? dirAr : dirEn;
      }

      update3DLabels() {
        if (!this.labelOverlay || this.isHero) return;
        if (!state.viewerSettings.showLabels) { this.labelOverlay.innerHTML = ''; return; }
        const rect = this.container.getBoundingClientRect();
        const width = rect.width, height = rect.height;
        if (!width || !height) return;

        // Zoom-aware density + collision-aware screen placement (Section 14)
        const showSecondary = this.spherical.radius < 5.6;
        const placedBoxes = [];
        const frag = document.createDocumentFragment();

        const candidates = ANATOMY_STRUCTURES.filter(item => this.structureGroups[item.id] && (item.id === this.selectedId || item.majorLabel || showSecondary));
        // Always place selected structure first
        candidates.sort((a, b) => (a.id === this.selectedId ? -1 : b.id === this.selectedId ? 1 : 0));

        candidates.forEach(item => {
          const grp = this.structureGroups[item.id];
          if (!grp || !grp.meshes.some(m => m.visible)) return;
          const pos = grp.anchor.clone();
          pos.project(this.camera);
          if (pos.z > 1) return;
          const x = (pos.x * 0.5 + 0.5) * width;
          const y = (-pos.y * 0.5 + 0.5) * height;
          if (x < 34 || x > width - 34 || y < 22 || y > height - 22) return;

          // Collision check (bounding box approx 88x24)
          const box = { x1: x - 44, y1: y - 12, x2: x + 44, y2: y + 12 };
          if (item.id !== this.selectedId && placedBoxes.some(b => !(box.x2 < b.x1 || box.x1 > b.x2 || box.y2 < b.y1 || box.y1 > b.y2))) {
            return;
          }
          placedBoxes.push(box);

          const isSelected = item.id === this.selectedId;
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = `label-3d px-2 py-0.5 rounded-full text-[11px] font-medium whitespace-nowrap border ${
            isSelected ? 'bg-cyan-500/95 text-navy-950 border-cyan-100 font-bold shadow-lg shadow-cyan-500/30 z-20'
            : 'bg-navy-900/85 text-slate-200 border-cyan-400/30 hover:border-cyan-300'
          }`;
          btn.style.left = `${x}px`;
          btn.style.top = `${y}px`;
          btn.textContent = state.lang === 'ar' ? item.arabicName : item.englishName;
          btn.addEventListener('click', (e) => { e.stopPropagation(); if (this.onSelect) this.onSelect(item.id, true); });
          frag.appendChild(btn);
        });
        this.labelOverlay.innerHTML = '';
        this.labelOverlay.appendChild(frag);
      }

      loadGLBFile(file, onProgress, onDone, onError) {
        if (!THREE.GLTFLoader) { onError('GLTFLoader is unavailable in this session.'); return; }
        const ext = file.name.split('.').pop().toLowerCase();
        if (!['glb', 'gltf'].includes(ext)) { onError('Unsupported file format. Please select .glb or .gltf.'); return; }
        const url = URL.createObjectURL(file);
        new THREE.GLTFLoader().load(
          url,
          (gltf) => {
            URL.revokeObjectURL(url);
            if (this.importedRoot) { this.scene.remove(this.importedRoot); this.importedRoot = null; }
            const root = gltf.scene || gltf.scenes[0];
            if (!root) { onError('Parsed GLTF file contains no scene.'); return; }
            const box = new THREE.Box3().setFromObject(root);
            const size = new THREE.Vector3(), center = new THREE.Vector3();
            box.getSize(size); box.getCenter(center);
            const scale = 3.8 / Math.max(size.x, size.y, size.z, 0.001);
            root.scale.setScalar(scale);
            root.position.sub(center.multiplyScalar(scale));
            root.position.y += 0.4;

            let meshCount = 0, vertexCount = 0;
            const matchedIds = [];
            root.traverse(n => {
              if (n.isMesh) {
                meshCount++;
                if (n.geometry?.attributes?.position) vertexCount += n.geometry.attributes.position.count;
                const lower = (n.name || '').toLowerCase();
                const m = ANATOMY_STRUCTURES.find(s => lower.includes(s.id.replace(/-/g, '')) || lower.includes(s.englishName.toLowerCase()));
                if (m) { n.userData.structureId = m.id; matchedIds.push(m.id); }
              }
            });
            this.importedRoot = root;
            this.scene.add(this.importedRoot);
            const l8 = state.layers.find(l => l.id === 'layer-additional');
            if (l8) { l8.available = true; l8.visible = true; l8.opacity = 1.0; }
            this.applyAllVisualStates();
            this.setCameraPreset('reset');
            onDone({ fileName: file.name, fileSizeKb: Math.round(file.size / 1024), meshCount, vertexCount, matchedIds: [...new Set(matchedIds)] });
          },
          (xhr) => { if (xhr.total > 0 && onProgress) onProgress(Math.round((xhr.loaded / xhr.total) * 100)); },
          () => { URL.revokeObjectURL(url); onError('Failed to parse GLB/GLTF file. Verify file integrity.'); }
        );
      }

      bindEvents() {
        const dom = this.renderer.domElement;
        dom.style.touchAction = 'none';

        this._onPointerDown = (e) => {
          this.activeTouches.set(e.pointerId, { x: e.clientX, y: e.clientY });
          if (this.activeTouches.size === 1) {
            this.isDragging = true;
            this.dragMode = (e.button === 2 || e.shiftKey) ? 'pan' : 'orbit';
            this.lastPointer = { x: e.clientX, y: e.clientY };
            this.pointerDownPos = { x: e.clientX, y: e.clientY };
          } else if (this.activeTouches.size === 2) {
            const pts = [...this.activeTouches.values()];
            this.lastPinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
          }
        };
        this._onPointerMove = (e) => {
          if (this.activeTouches.has(e.pointerId)) {
            this.activeTouches.set(e.pointerId, { x: e.clientX, y: e.clientY });
          }
          if (this.activeTouches.size === 2) {
            const pts = [...this.activeTouches.values()];
            const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
            if (this.lastPinchDist) {
              this.desiredSpherical.radius = Math.max(1.8, Math.min(13, this.desiredSpherical.radius - (dist - this.lastPinchDist) * 0.015));
            }
            this.lastPinchDist = dist;
            return;
          }
          if (!this.isDragging) return;
          const dx = e.clientX - this.lastPointer.x;
          const dy = e.clientY - this.lastPointer.y;
          this.lastPointer = { x: e.clientX, y: e.clientY };
          if (this.dragMode === 'orbit') {
            this.desiredSpherical.theta -= dx * 0.0085;
            this.desiredSpherical.phi = Math.max(0.2, Math.min(Math.PI - 0.2, this.desiredSpherical.phi - dy * 0.0085));
          } else {
            const ps = this.desiredSpherical.radius * 0.0016;
            this.desiredTarget.x -= dx * ps;
            this.desiredTarget.y += dy * ps;
          }
        };
        this._onPointerUp = (e) => {
          this.activeTouches.delete(e.pointerId);
          if (this.activeTouches.size < 2) this.lastPinchDist = null;
          if (!this.isDragging) return;
          this.isDragging = false;
          const dist = Math.hypot(e.clientX - this.pointerDownPos.x, e.clientY - this.pointerDownPos.y);
          if (dist < 6 && !this.isHero && this.onSelect) {
            const now = Date.now();
            const isDoubleTap = (now - this.lastTapTime) < 320;
            this.lastTapTime = now;

            const rect = dom.getBoundingClientRect();
            this.mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            this.mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
            this.raycaster.setFromCamera(this.mouse, this.camera);
            // Prevent accidental selection of hidden meshes (Section 09)
            const visibleTargets = this.selectableMeshes.filter(m => m.visible && (!m.parent || m.parent.visible));
            const hits = this.raycaster.intersectObjects(visibleTargets, false);
            if (hits.length) {
              const sid = hits[0].object.userData.structureId;
              this.onSelect(sid, isDoubleTap);
            }
          }
        };
        this._onWheel = (e) => {
          e.preventDefault();
          this.desiredSpherical.radius = Math.max(1.8, Math.min(13, this.desiredSpherical.radius + e.deltaY * 0.0038));
        };
        this._onContextMenu = (e) => e.preventDefault();
        this._onResize = () => this.resize();

        dom.addEventListener('pointerdown', this._onPointerDown);
        window.addEventListener('pointermove', this._onPointerMove);
        window.addEventListener('pointerup', this._onPointerUp);
        dom.addEventListener('wheel', this._onWheel, { passive: false });
        dom.addEventListener('contextmenu', this._onContextMenu);
        window.addEventListener('resize', this._onResize);
      }

      resize() {
        if (this.disposed || !this.renderer || !this.container) return;
        const rect = this.container.getBoundingClientRect();
        const w = Math.max(Math.round(rect.width), 260);
        const h = Math.max(Math.round(rect.height), 220);
        this.camera.aspect = w / h;
        this.camera.updateProjectionMatrix();
        this.renderer.setPixelRatio(this.getQualityPixelRatio());
        this.renderer.setSize(w, h, false);
        this.update3DLabels();
      }

      animate() {
        if (this.disposed) return;
        this.animFrameId = requestAnimationFrame(() => this.animate());
        const elapsed = this.clock.getElapsedTime();

        if (this.isHero && !this.isDragging && !state.reducedMotion) {
          this.desiredSpherical.theta += 0.0028;
        }
        // Optional Illustrative Cardiac Motion Demo (Section 17 — clearly labeled illustrative, paused by default)
        if (!this.isHero && state.physiologyDemo.playing && !state.reducedMotion && this.heartPulseGroup) {
          const pulse = 1 + 0.045 * Math.pow(Math.max(0, Math.sin(elapsed * 3.8 * state.physiologyDemo.bpmScale)), 4);
          this.heartPulseGroup.scale.setScalar(pulse);
        } else if (this.heartPulseGroup) {
          this.heartPulseGroup.scale.setScalar(1);
        }

        const damp = state.reducedMotion ? 1 : 0.12;
        this.spherical.radius += (this.desiredSpherical.radius - this.spherical.radius) * damp;
        this.spherical.theta += (this.desiredSpherical.theta - this.spherical.theta) * damp;
        this.spherical.phi += (this.desiredSpherical.phi - this.spherical.phi) * damp;
        this.target.lerp(this.desiredTarget, damp);

        this.updateCameraFromSpherical();
        this.renderer.render(this.scene, this.camera);
        if (!this.isHero) this.update3DLabels();
      }

      dispose() {
        this.disposed = true;
        if (this._resizeObserver) { this._resizeObserver.disconnect(); this._resizeObserver = null; }
        if (this.animFrameId) cancelAnimationFrame(this.animFrameId);
        if (this.scene) {
          this.scene.traverse(obj => {
            if (obj.geometry) obj.geometry.dispose();
            if (obj.material) {
              if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
              else obj.material.dispose();
            }
          });
        }
        if (this.renderer?.domElement) {
          const dom = this.renderer.domElement;
          dom.removeEventListener('pointerdown', this._onPointerDown);
          dom.removeEventListener('wheel', this._onWheel);
          dom.removeEventListener('contextmenu', this._onContextMenu);
          this.renderer.dispose();
        }
        window.removeEventListener('pointermove', this._onPointerMove);
        window.removeEventListener('pointerup', this._onPointerUp);
        window.removeEventListener('resize', this._onResize);
      }
    }

            ov.classList.add('hidden');

          (err) => { ov.classList.add('hidden'); showToast(err, 'error'); }
        );

    // ---------- UNIVERSAL DETERMINISTIC SIMULATION ENGINE & 3D ORGAN LAB ----------
    class PhysiologyLabEngine {
      constructor(canvasContainer, chartCanvas, uiCallbacks) {
        this.container = canvasContainer;
        this.chartCanvas = chartCanvas;
        this.uiCallbacks = uiCallbacks;
        this.disposed = false;
        this.animFrameId = null;
        this.simTime = 0;
        this.lastFrameTs = null;
        this.lastUiSyncTs = 0;
        this.lastPhaseId = '';

        // Camera orbit state
        this.target = new THREE.Vector3(0, 0, 0);
        this.spherical = { radius: 5.8, theta: 0.22, phi: 1.48 };
        this.desiredSpherical = { ...this.spherical };
        this.isDragging = false;
        this.lastPointer = { x: 0, y: 0 };

        this.particles = [];
        this.animObjects = {};
        this.initialize();
      }

      initialize() {
        if (typeof THREE === 'undefined') return;
        const rect = this.container.getBoundingClientRect();
        const w = Math.max(Math.round(rect.width), 300);
        const h = Math.max(Math.round(rect.height), 260);

        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0x061022);
        this.camera = new THREE.PerspectiveCamera(42, w / h, 0.1, 100);
        this.updateCamera();

        this.renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        this.renderer.setSize(w, h, false);
        this.renderer.domElement.style.width = '100%';
        this.renderer.domElement.style.height = '100%';
        this.renderer.domElement.style.display = 'block';
        this.container.innerHTML = '';
        this.container.appendChild(this.renderer.domElement);

        if (typeof ResizeObserver !== 'undefined') {
          this._ro = new ResizeObserver(() => this.resize());
          this._ro.observe(this.container);
        }
        setTimeout(() => this.resize(), 100);

        // Lighting
        this.scene.add(new THREE.AmbientLight(0xdbeafe, 0.6));
        const key = new THREE.DirectionalLight(0xffffff, 1.25); key.position.set(5, 7, 6); this.scene.add(key);
        const rim = new THREE.DirectionalLight(0x22d3ee, 0.7); rim.position.set(-5, 3, -5); this.scene.add(rim);

        this.labRoot = new THREE.Group();
        this.scene.add(this.labRoot);

        this.buildCurrentSystemScene();
        this.bindEvents();
        this.start();
      }

      clearLabRoot() {
        while (this.labRoot.children.length) {
          const obj = this.labRoot.children[0];
          this.labRoot.remove(obj);
          obj.traverse?.(n => {
            if (n.geometry) n.geometry.dispose();
            if (n.material) { if (Array.isArray(n.material)) n.material.forEach(m => m.dispose()); else n.material.dispose(); }
          });
        }
        this.particles = [];
        this.animObjects = {};
      }

      makeMat(hex, opacity = 1, emissive = 0x000000) {
        return new THREE.MeshStandardMaterial({ color: hex, roughness: 0.4, metalness: 0.08, transparent: opacity < 1, opacity, emissive, emissiveIntensity: 0 });
      }

      buildCurrentSystemScene() {
        this.clearLabRoot();
        const sys = state.physio.systemId;
        this.desiredSpherical = { radius: 5.8, theta: 0.22, phi: 1.48 };
        this.target.set(0, 0, 0);

        if (sys === 'cardiovascular') this.buildCardioLab();
        else if (sys === 'respiratory') this.buildRespLab();
        else if (sys === 'nervous') this.buildNeuralLab();
        else if (sys === 'urinary') this.buildRenalLab();
        else if (sys === 'digestive') this.buildDigestiveLab();
      }

      buildCardioLab() {
        // 4 Chambers + Conduction Nodes + Systemic/Pulmonary Curves + Valve Rings
        const ra = new THREE.Mesh(new THREE.SphereGeometry(0.55, 24, 20), this.makeMat(0x2563eb));
        ra.position.set(-0.78, 0.58, 0.08); this.labRoot.add(ra);
        const la = new THREE.Mesh(new THREE.SphereGeometry(0.54, 24, 20), this.makeMat(0xf43f5e));
        la.position.set(0.75, 0.58, -0.08); this.labRoot.add(la);
        const rv = new THREE.Mesh(new THREE.SphereGeometry(0.72, 26, 20), this.makeMat(0x1d4ed8));
        rv.scale.set(0.92, 1.22, 0.84); rv.position.set(-0.52, -0.58, 0.16); this.labRoot.add(rv);
        const lv = new THREE.Mesh(new THREE.SphereGeometry(0.8, 28, 22), this.makeMat(0xe11d48));
        lv.scale.set(0.92, 1.32, 0.9); lv.position.set(0.54, -0.62, -0.05); this.labRoot.add(lv);

        // 4 Valve Rings (Tricuspid, Mitral, Pulmonary, Aortic)
        const vTri = new THREE.Mesh(new THREE.TorusGeometry(0.22, 0.05, 10, 24), this.makeMat(0xfacc15));
        vTri.rotation.x = Math.PI / 2; vTri.position.set(-0.64, 0.04, 0.12); this.labRoot.add(vTri);
        const vMit = new THREE.Mesh(new THREE.TorusGeometry(0.22, 0.05, 10, 24), this.makeMat(0xfacc15));
        vMit.rotation.x = Math.PI / 2; vMit.position.set(0.64, 0.04, -0.04); this.labRoot.add(vMit);
        const vPul = new THREE.Mesh(new THREE.TorusGeometry(0.18, 0.045, 10, 24), this.makeMat(0x38bdf8));
        vPul.rotation.x = Math.PI / 2; vPul.position.set(-0.22, 0.25, 0.45); this.labRoot.add(vPul);
        const vAor = new THREE.Mesh(new THREE.TorusGeometry(0.18, 0.045, 10, 24), this.makeMat(0xfb7185));
        vAor.rotation.x = Math.PI / 2; vAor.position.set(0.18, 0.28, 0.15); this.labRoot.add(vAor);

        // Conduction Nodes (SA -> AV -> Bundle)
        const saNode = new THREE.Mesh(new THREE.SphereGeometry(0.12, 14, 12), this.makeMat(0xfef08a, 1, 0xfacc15));
        saNode.position.set(-1.12, 0.95, 0.35); this.labRoot.add(saNode);
        const avNode = new THREE.Mesh(new THREE.SphereGeometry(0.11, 14, 12), this.makeMat(0xfef08a, 1, 0xfacc15));
        avNode.position.set(-0.18, 0.18, 0.38); this.labRoot.add(avNode);
        const bundle = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1.15, 10), this.makeMat(0xfef08a, 1, 0xfacc15));
        bundle.position.set(0.0, -0.52, 0.36); this.labRoot.add(bundle);

        // Pulmonary Loop Curve (Blue -> Red through Lungs) & Systemic Loop Curve (Red -> Blue)
        const pulmCurve = new THREE.CatmullRomCurve3([
          new THREE.Vector3(-0.52, -0.4, 0.25), new THREE.Vector3(-0.22, 0.95, 0.45),
          new THREE.Vector3(-1.85, 1.55, 0.1), new THREE.Vector3(1.85, 1.55, -0.1),
          new THREE.Vector3(0.85, 0.62, -0.15)
        ]);
        const sysCurve = new THREE.CatmullRomCurve3([
          new THREE.Vector3(0.54, -0.4, 0.05), new THREE.Vector3(0.25, 1.55, 0.05),
          new THREE.Vector3(2.15, 0.2, -0.25), new THREE.Vector3(0.0, -1.95, -0.25),
          new THREE.Vector3(-2.15, 0.2, 0.15), new THREE.Vector3(-0.85, 0.72, 0.1)
        ]);

        const pulmTube = new THREE.Mesh(new THREE.TubeGeometry(pulmCurve, 44, 0.08, 12, false), this.makeMat(0x0ea5e9, 0.45));
        const sysTube = new THREE.Mesh(new THREE.TubeGeometry(sysCurve, 56, 0.09, 12, false), this.makeMat(0xef4444, 0.45));
        this.labRoot.add(pulmTube, sysTube);

        // Blood flow particles along defined vascular paths
        for (let i = 0; i < 10; i++) {
          const p = new THREE.Mesh(new THREE.SphereGeometry(0.085, 12, 10), this.makeMat(0x38bdf8, 1, 0x0ea5e9));
          this.labRoot.add(p);
          this.particles.push({ mesh: p, curve: pulmCurve, offset: i / 10, type: 'pulmonary' });
        }
        for (let i = 0; i < 12; i++) {
          const p = new THREE.Mesh(new THREE.SphereGeometry(0.09, 12, 10), this.makeMat(0xfb7185, 1, 0xe11d48));
          this.labRoot.add(p);
          this.particles.push({ mesh: p, curve: sysCurve, offset: i / 12, type: 'systemic' });
        }

        this.animObjects = { ra, la, rv, lv, vTri, vMit, vPul, vAor, saNode, avNode, bundle, pulmTube, sysTube };
      }

      buildRespLab() {
        if (state.physio.respCloseUp) {
          // Alveolar-Capillary Gas Exchange Interface (Section 11)
          const alv = new THREE.Mesh(new THREE.SphereGeometry(1.35, 32, 24), this.makeMat(0xfda4af, 0.32));
          alv.position.set(0, 0.72, 0); this.labRoot.add(alv);
          const capCurve = new THREE.CatmullRomCurve3([new THREE.Vector3(-2.6, -0.95, 0), new THREE.Vector3(-0.9, -0.78, 0.1), new THREE.Vector3(0.9, -0.78, 0.1), new THREE.Vector3(2.6, -0.95, 0)]);
          const cap = new THREE.Mesh(new THREE.TubeGeometry(capCurve, 40, 0.34, 16, false), this.makeMat(0x3b82f6, 0.38));
          this.labRoot.add(cap);

          // Red Blood Cells transitioning venous -> arterial
          for (let i = 0; i < 7; i++) {
            const rbc = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.08, 16), this.makeMat(0xe11d48));
            rbc.rotation.x = Math.PI / 2;
            this.labRoot.add(rbc);
            this.particles.push({ mesh: rbc, curve: capCurve, offset: i / 7, type: 'rbc' });
          }
          // O2 particles (Alveolus -> Capillary) & CO2 particles (Capillary -> Alveolus)
          const o2Curve = new THREE.CatmullRomCurve3([new THREE.Vector3(-0.35, 0.85, 0.2), new THREE.Vector3(-0.35, 0.0, 0.2), new THREE.Vector3(-0.35, -0.78, 0.2)]);
          const co2Curve = new THREE.CatmullRomCurve3([new THREE.Vector3(0.45, -0.78, 0.2), new THREE.Vector3(0.45, 0.0, 0.2), new THREE.Vector3(0.45, 0.85, 0.2)]);
          for (let i = 0; i < 6; i++) {
            const o2 = new THREE.Mesh(new THREE.SphereGeometry(0.08, 12, 10), this.makeMat(0x22d3ee, 1, 0x06b6d4));
            const co2 = new THREE.Mesh(new THREE.SphereGeometry(0.08, 12, 10), this.makeMat(0xfbbf24, 1, 0xd97706));
            this.labRoot.add(o2, co2);
            this.particles.push({ mesh: o2, curve: o2Curve, offset: i / 6, type: 'o2' });
            this.particles.push({ mesh: co2, curve: co2Curve, offset: i / 6, type: 'co2' });
          }
          this.animObjects = { isAlveoli: true, alv };
        } else {
          // Lungs, Trachea, Bronchi, Diaphragm
          const trachea = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.22, 1.5, 16), this.makeMat(0x94a3b8));
          trachea.position.set(0, 1.55, 0); this.labRoot.add(trachea);
          const rLung = new THREE.Mesh(new THREE.SphereGeometry(0.86, 28, 22), this.makeMat(0xfda4af, 0.88));
          rLung.scale.set(0.82, 1.48, 0.78); rLung.position.set(-0.98, 0.22, 0); this.labRoot.add(rLung);
          const lLung = new THREE.Mesh(new THREE.SphereGeometry(0.82, 28, 22), this.makeMat(0xfb7185, 0.88));
          lLung.scale.set(0.76, 1.5, 0.78); lLung.position.set(0.98, 0.22, 0); this.labRoot.add(lLung);
          const diaphragm = new THREE.Mesh(new THREE.SphereGeometry(1.75, 32, 18, 0, Math.PI * 2, 0, Math.PI * 0.45), this.makeMat(0xd97706, 0.9));
          diaphragm.scale.set(1.05, 0.45, 0.62); diaphragm.position.set(0, -1.35, 0); this.labRoot.add(diaphragm);
          this.animObjects = { isAlveoli: false, rLung, lLung, diaphragm };
        }
      }

      buildNeuralLab() {
        // Soma + Dendrites + Myelinated Axon with Nodes of Ranvier + Synapse
        const soma = new THREE.Mesh(new THREE.SphereGeometry(0.62, 24, 20), this.makeMat(0xc084fc));
        soma.position.set(-2.2, 0.1, 0); this.labRoot.add(soma);
        const axon = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 3.6, 14), this.makeMat(0xe2e8f0));
        axon.rotation.z = Math.PI / 2; axon.position.set(-0.1, 0.1, 0); this.labRoot.add(axon);

        const nodes = [];
        [-1.1, -0.35, 0.4, 1.15].forEach((nx, i) => {
          const myelin = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.52, 16), this.makeMat(0x38bdf8, 0.75));
          myelin.rotation.z = Math.PI / 2; myelin.position.set(nx - 0.36, 0.1, 0); this.labRoot.add(myelin);
          const node = new THREE.Mesh(new THREE.SphereGeometry(0.14, 14, 12), this.makeMat(0xfacc15, 1, 0xfacc15));
          node.position.set(nx, 0.1, 0); this.labRoot.add(node);
          nodes.push(node);
        });

        const terminal = new THREE.Mesh(new THREE.SphereGeometry(0.32, 18, 16), this.makeMat(0xa855f7));
        terminal.position.set(1.82, 0.1, 0); this.labRoot.add(terminal);
        const postSyn = new THREE.Mesh(new THREE.BoxGeometry(0.28, 1.15, 0.85), this.makeMat(0x14b8a6, 0.85));
        postSyn.position.set(2.55, 0.1, 0); this.labRoot.add(postSyn);

        const synCurve = new THREE.CatmullRomCurve3([new THREE.Vector3(1.95, 0.1, 0), new THREE.Vector3(2.25, 0.18, 0.08), new THREE.Vector3(2.45, 0.1, 0)]);
        for (let i = 0; i < 6; i++) {
          const ves = new THREE.Mesh(new THREE.SphereGeometry(0.06, 10, 8), this.makeMat(0x22d3ee, 1, 0x22d3ee));
          this.labRoot.add(ves);
          this.particles.push({ mesh: ves, curve: synCurve, offset: i / 6, type: 'nt' });
        }
        this.animObjects = { soma, nodes, terminal, postSyn };
      }

      buildRenalLab() {
        // Nephron Teaching Scene: Glomerulus -> Bowman's Capsule -> PCT -> Loop of Henle -> DCT -> Collecting Duct
        const glom = new THREE.Mesh(new THREE.TorusKnotGeometry(0.36, 0.09, 48, 8, 2, 3), this.makeMat(0xef4444));
        glom.position.set(-1.75, 1.15, 0); this.labRoot.add(glom);
        const bowman = new THREE.Mesh(new THREE.SphereGeometry(0.58, 22, 18), this.makeMat(0x38bdf8, 0.35));
        bowman.position.set(-1.75, 1.15, 0); this.labRoot.add(bowman);

        const nephronCurve = new THREE.CatmullRomCurve3([
          new THREE.Vector3(-1.35, 1.15, 0), new THREE.Vector3(-0.65, 1.35, 0.15),
          new THREE.Vector3(-0.35, 0.45, 0), new THREE.Vector3(-0.25, -1.65, 0),
          new THREE.Vector3(0.35, -1.65, 0), new THREE.Vector3(0.5, 0.55, 0),
          new THREE.Vector3(1.15, 1.1, 0.1), new THREE.Vector3(1.85, 0.95, 0),
          new THREE.Vector3(1.85, -1.75, 0)
        ]);
        const tubule = new THREE.Mesh(new THREE.TubeGeometry(nephronCurve, 64, 0.14, 14, false), this.makeMat(0xf59e0b, 0.62));
        this.labRoot.add(tubule);

        for (let i = 0; i < 14; i++) {
          const flt = new THREE.Mesh(new THREE.SphereGeometry(0.08, 12, 10), this.makeMat(0xfef08a, 1, 0xfacc15));
          this.labRoot.add(flt);
          this.particles.push({ mesh: flt, curve: nephronCurve, offset: i / 14, type: 'filtrate' });
        }
        this.animObjects = { glom, bowman, tubule };
      }

      buildDigestiveLab() {
        // Esophagus -> Stomach -> Small Intestine -> Large Intestine
        const giCurve = new THREE.CatmullRomCurve3([
          new THREE.Vector3(0, 2.2, 0), new THREE.Vector3(0.15, 1.15, 0.1),
          new THREE.Vector3(0.75, 0.55, 0.15), new THREE.Vector3(0.25, -0.05, 0.1),
          new THREE.Vector3(-0.65, -0.45, 0.15), new THREE.Vector3(0.65, -0.9, 0.15),
          new THREE.Vector3(-0.85, -1.45, 0.05), new THREE.Vector3(0.85, -1.65, -0.05),
          new THREE.Vector3(0.2, -2.1, -0.1)
        ]);
        const giTube = new THREE.Mesh(new THREE.TubeGeometry(giCurve, 72, 0.2, 16, false), this.makeMat(0xf59e0b, 0.55));
        this.labRoot.add(giTube);
        const stomach = new THREE.Mesh(new THREE.SphereGeometry(0.58, 22, 18), this.makeMat(0xea580c, 0.72));
        stomach.scale.set(1.1, 0.85, 0.75); stomach.position.set(0.55, 0.55, 0.15); this.labRoot.add(stomach);

        for (let i = 0; i < 8; i++) {
          const bolus = new THREE.Mesh(new THREE.SphereGeometry(0.14, 14, 12), this.makeMat(0x2dd4bf, 1, 0x14b8a6));
          this.labRoot.add(bolus);
          this.particles.push({ mesh: bolus, curve: giCurve, offset: i / 8, type: 'bolus' });
        }
        this.animObjects = { stomach, giTube };
      }

      getCurrentPhaseInfo(cycleFrac) {
        const sys = state.physio.systemId;
        if (sys === 'cardiovascular') {
          return CARDIAC_PHASES.find(p => cycleFrac >= p.start && cycleFrac < p.end) || CARDIAC_PHASES[0];
        }
        if (sys === 'respiratory') {
          return cycleFrac < 0.42
            ? { id: 'inspiration', nameEn: 'Inspiration (Diaphragm Contracts)', nameAr: 'الشهيق (انقباض الحجاب الحاجز)', descEn: 'Diaphragm flattens downward, thoracic volume expands, and air flows into alveoli.', descAr: 'يتسطح الحجاب الحاجز للأسفل ويتسع القفص الصدري فيندفع الهواء إلى الحويصلات.' }
            : { id: 'expiration', nameEn: 'Expiration (Elastic Recoil)', nameAr: 'الزفير (الارتداد المرن)', descEn: 'Diaphragm relaxes upward, thoracic volume decreases, and CO2-rich air exits.', descAr: 'يرتخي الحجاب الحاجز للأعلى ويقل حجم الصدر فيخرج الهواء المحمّل بثاني أكسيد الكربون.' };
        }
        if (sys === 'nervous') {
          if (cycleFrac < 0.2) return { id: 'rest', nameEn: 'Resting Potential (~ -70 mV Schematic)', nameAr: 'جهد الراحة التخطيطي (~ -70 مللي فولت)', descEn: 'Na+/K+-ATPase maintains negative intracellular resting potential.', descAr: 'تحافظ مضخة الصوديوم والبوتاسيوم على جهد راحة سالب داخل الخلية العصبية.' };
          if (cycleFrac < 0.5) return { id: 'depol', nameEn: 'Depolarization & Saltatory Conduction', nameAr: 'إزالة الاستقطاب والتوصيل القفزي', descEn: 'Voltage-gated Na+ channels open sequentially at Nodes of Ranvier.', descAr: 'تفتح قنوات الصوديوم المبوبة بالجهد تتابعياً عند عقد رانفييه.' };
          if (cycleFrac < 0.78) return { id: 'repol', nameEn: 'Repolarization (K+ Efflux)', nameAr: 'إعادة الاستقطاب (خروج البوتاسيوم)', descEn: 'K+ efflux restores negative membrane potential as impulse reaches axon terminal.', descAr: 'يعيد خروج البوتاسيوم سلبية الغشاء مع وصول الإشارة للنهاية المحورية.' };
          return { id: 'synapse', nameEn: 'Synaptic Transmission', nameAr: 'النقل العصبي المشبكي', descEn: 'Neurotransmitter vesicles cross the synaptic cleft to activate postsynaptic receptors.', descAr: 'تعبر النواقل العصبية الشق المشبكي لتحفيز مستقبلات الخلية التالية.' };
        }
        if (sys === 'urinary') {
          if (cycleFrac < 0.25) return { id: 'filt', nameEn: '1. Glomerular Filtration', nameAr: '1. الترشيح الكبيبي', descEn: 'Water and small solutes filter from glomerulus into Bowman’s capsule.', descAr: 'يترشح الماء والمذابات الصغيرة من الكبيبة إلى محفظة بومان.' };
          if (cycleFrac < 0.6) return { id: 'reab', nameEn: '2. Tubular Reabsorption', nameAr: '2. إعادة الامتصاص الأنبوبي', descEn: 'Glucose, amino acids, electrolytes, and water are reclaimed along PCT and Loop of Henle.', descAr: 'تُستعاد معظم السوائل والأملاح والغلوكوز عبر الأنبوب القريب والتواء هنلي.' };
          if (cycleFrac < 0.82) return { id: 'secr', nameEn: '3. Tubular Secretion', nameAr: '3. الإفراز الأنبوبي', descEn: 'Additional metabolic wastes and H+/K+ ions are secreted into the distal tubule.', descAr: 'تُفرز فضلات إضافية وأيونات الهيدروجين والبوتاسيوم نحو الأنبوب البعيد.' };
          return { id: 'urine', nameEn: '4. Urine Formation & Collection', nameAr: '4. تكوين البول وتجميعه', descEn: 'Final concentrated urine travels down the collecting duct toward the ureter.', descAr: 'ينتقل البول النهائي عبر القناة الجامعة نحو الحالب فالمثانة.' };
        }
        // digestive
        if (cycleFrac < 0.25) return { id: 'esoph', nameEn: '1. Swallowing & Esophageal Transport', nameAr: '1. البلع والنقل المريئي', descEn: 'Primary peristalsis moves the bolus down the esophagus to the stomach.', descAr: 'تدفع الحركة الدودية اللقمة عبر المريء إلى المعدة.' };
        if (cycleFrac < 0.55) return { id: 'gastric', nameEn: '2. Gastric Mixing & Acid Secretion', nameAr: '2. الخلط المعدي والإفرازات', descEn: 'Stomach smooth muscle churns food with gastric acid and enzymes into chyme.', descAr: 'تخلط عضلات المعدة الطعام مع الحمض والإنزيمات لتحويله إلى كيموس.' };
        if (cycleFrac < 0.82) return { id: 'absorb', nameEn: '3. Small Intestinal Peristalsis & Absorption', nameAr: '3. الحركة الدودية وامتصاص المغذيات', descEn: 'Myenteric plexus waves mix chyme with bile/pancreatic enzymes for villous absorption.', descAr: 'تمزج موجات الأمعاء الدقيقة الكيموس بالصفراء وإنزيمات البنكرياس لامتصاص المغذيات.' };
        return { id: 'colon', nameEn: '4. Colonic Water Absorption', nameAr: '4. امتصاص الماء في القولون', descEn: 'Large intestine reabsorbs remaining water and electrolytes.', descAr: 'تمتص الأمعاء الغليظة الماء والأملاح المتبقية.' };
      }

      drawSynchronizedChart(cycleFrac) {
        const cvs = this.chartCanvas;
        if (!cvs) return;
        const ctx = cvs.getContext('2d');
        const w = cvs.width, h = cvs.height;
        ctx.clearRect(0, 0, w, h);

        // Background scientific grid
        ctx.fillStyle = '#050c1a';
        ctx.fillRect(0, 0, w, h);
        ctx.strokeStyle = 'rgba(34,211,238,0.08)';
        ctx.lineWidth = 1;
        for (let x = 0; x < w; x += 28) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
        for (let y = 0; y < h; y += 22) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }

        const sys = state.physio.systemId;
        const evalY = (u) => {
          const p = ((u % 1) + 1) % 1;
          if (sys === 'cardiovascular') {
            // Schematic ECG waveform (P wave, QRS complex, T wave)
            let v = 0;
            v += 0.18 * Math.exp(-Math.pow((p - 0.09) / 0.03, 2)); // P
            v -= 0.14 * Math.exp(-Math.pow((p - 0.17) / 0.012, 2)); // Q
            v += 0.92 * Math.exp(-Math.pow((p - 0.20) / 0.015, 2)); // R
            v -= 0.26 * Math.exp(-Math.pow((p - 0.23) / 0.014, 2)); // S
            v += 0.28 * Math.exp(-Math.pow((p - 0.52) / 0.045, 2)); // T
            return h * 0.68 - v * (h * 0.52);
          }
          if (sys === 'respiratory') {
            const v = p < 0.42 ? Math.sin((p / 0.42) * Math.PI * 0.5) : Math.cos(((p - 0.42) / 0.58) * Math.PI * 0.5);
            return h * 0.78 - v * (h * 0.56);
          }
          if (sys === 'nervous') {
            let v = 0;
            if (p > 0.2 && p < 0.75) {
              v = 1.0 * Math.exp(-Math.pow((p - 0.38) / 0.06, 2)) - 0.16 * Math.exp(-Math.pow((p - 0.58) / 0.06, 2));
            }
            return h * 0.72 - v * (h * 0.54);
          }
          // Renal / Digestive phase progression wave
          const v = 0.5 + 0.35 * Math.sin(p * Math.PI * 2 - Math.PI / 2);
          return h * 0.82 - v * (h * 0.6);
        };

        // Draw 2 cycles across chart width
        ctx.strokeStyle = sys === 'cardiovascular' ? '#22d3ee' : sys === 'respiratory' ? '#2dd4bf' : sys === 'nervous' ? '#c084fc' : '#f59e0b';
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        for (let px = 0; px <= w; px += 2) {
          const y = evalY((px / w) * 2);
          if (px === 0) ctx.moveTo(px, y); else ctx.lineTo(px, y);
        }
        ctx.stroke();

        // Live playhead cursor synchronized to simulation clock
        const cursorX = ((cycleFrac) % 1) * (w / 2) + (w * 0.25);
        ctx.strokeStyle = '#facc15';
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(cursorX, 0); ctx.lineTo(cursorX, h); ctx.stroke();
        ctx.fillStyle = '#facc15';
        ctx.beginPath(); ctx.arc(cursorX, evalY((cursorX / w) * 2), 4.5, 0, Math.PI * 2); ctx.fill();
      }

      stepVisuals(cycleFrac) {
        const sys = state.physio.systemId;
        if (sys === 'cardiovascular') {
          const { ra, la, rv, lv, vTri, vMit, vPul, vAor, saNode, avNode, bundle, pulmTube, sysTube } = this.animObjects;
          if (!ra) return;
          const phase = this.getCurrentPhaseInfo(cycleFrac);
          const aScale = phase.id === 'atrial-systole' ? 0.92 : 1.0;
          const vScale = phase.id === 'ventricular-ejection' ? 0.91 : 1.0;
          if (!state.reducedMotion) {
            ra.scale.setScalar(aScale); la.scale.setScalar(aScale);
            rv.scale.set(0.92 * vScale, 1.22 * vScale, 0.84 * vScale);
            lv.scale.set(0.92 * vScale, 1.32 * vScale, 0.9 * vScale);
          }
          // Valve visual cues (open = glowing teal, closed = muted amber)
          const setV = (m, open) => { m.material.color.setHex(open ? 0x2dd4bf : 0x64748b); m.material.emissiveIntensity = open ? 0.5 : 0; };
          setV(vTri, phase.valves.tricuspid === 'OPEN');
          setV(vMit, phase.valves.mitral === 'OPEN');
          setV(vPul, phase.valves.pulmonary === 'OPEN');
          setV(vAor, phase.valves.aortic === 'OPEN');

          // Conduction glow sequence
          saNode.visible = avNode.visible = bundle.visible = state.physio.showConduction;
          saNode.material.emissiveIntensity = cycleFrac < 0.14 ? 0.9 : 0.1;
          avNode.material.emissiveIntensity = (cycleFrac >= 0.12 && cycleFrac < 0.22) ? 0.9 : 0.1;
          bundle.material.emissiveIntensity = (cycleFrac >= 0.18 && cycleFrac < 0.45) ? 0.85 : 0.1;

          // Pathway visibility
          const cv = state.physio.circView;
          pulmTube.visible = cv !== 'systemic';
          sysTube.visible = cv !== 'pulmonary';
          this.particles.forEach(p => {
            p.mesh.visible = (p.type === 'pulmonary' && cv !== 'systemic') || (p.type === 'systemic' && cv !== 'pulmonary');
            const u = (cycleFrac + p.offset) % 1;
            p.mesh.position.copy(p.curve.getPointAt(u));
          });
        } else if (sys === 'respiratory') {
          if (this.animObjects.isAlveoli) {
            this.particles.forEach(p => {
              const u = (cycleFrac + p.offset) % 1;
              p.mesh.position.copy(p.curve.getPointAt(u));
              if (p.type === 'rbc') p.mesh.material.color.setHex(u < 0.5 ? 0x2563eb : 0xe11d48);
            });
          } else if (this.animObjects.rLung && !state.reducedMotion) {
            const exp = cycleFrac < 0.42 ? Math.sin((cycleFrac / 0.42) * Math.PI * 0.5) : Math.cos(((cycleFrac - 0.42) / 0.58) * Math.PI * 0.5);
            this.animObjects.rLung.scale.set(0.82 * (1 + 0.1 * exp), 1.48 * (1 + 0.08 * exp), 0.78 * (1 + 0.1 * exp));
            this.animObjects.lLung.scale.set(0.76 * (1 + 0.1 * exp), 1.5 * (1 + 0.08 * exp), 0.78 * (1 + 0.1 * exp));
            this.animObjects.diaphragm.position.y = -1.35 - 0.28 * exp;
          }
        } else if (sys === 'nervous') {
          const { nodes } = this.animObjects;
          if (nodes) {
            nodes.forEach((n, idx) => {
              const active = cycleFrac >= (0.2 + idx * 0.12) && cycleFrac < (0.34 + idx * 0.12);
              n.material.emissiveIntensity = active ? 1.0 : 0.08;
              n.scale.setScalar(active ? 1.35 : 1.0);
            });
          }
          this.particles.forEach(p => {
            p.mesh.visible = cycleFrac > 0.65;
            const u = ((cycleFrac - 0.65) / 0.35 + p.offset) % 1;
            p.mesh.position.copy(p.curve.getPointAt(Math.max(0, Math.min(1, u))));
          });
        } else {
          this.particles.forEach(p => {
            const u = (cycleFrac + p.offset) % 1;
            p.mesh.position.copy(p.curve.getPointAt(u));
          });
        }
      }

      getCycleDurationSeconds() {
        const sys = state.physio.systemId;
        if (sys === 'cardiovascular') return 60 / Math.max(40, Math.min(160, state.physio.heartRateBpm));
        if (sys === 'respiratory') return 60 / Math.max(8, Math.min(35, state.physio.breathingRateBpm));
        return 3.5;
      }

      updateCamera() {
        const { radius, theta, phi } = this.spherical;
        const s = Math.sin(phi);
        this.camera.position.set(this.target.x + radius * s * Math.sin(theta), this.target.y + radius * Math.cos(phi), this.target.z + radius * s * Math.cos(theta));
        this.camera.lookAt(this.target);
      }

      start() {
        const loop = (ts) => {
          if (this.disposed) return;
          this.animFrameId = requestAnimationFrame(loop);
          if (this.lastFrameTs === null) this.lastFrameTs = ts;
          // Deterministic clamped delta (handles tab suspension safely)
          const rawDelta = Math.min((ts - this.lastFrameTs) / 1000, 0.05);
          this.lastFrameTs = ts;

          if (state.physio.isRunning) {
            this.simTime += rawDelta * state.physio.playbackSpeed;
          }
          const period = this.getCycleDurationSeconds();
          const cycleFrac = (this.simTime % period) / period;

          this.stepVisuals(cycleFrac);
          this.drawSynchronizedChart(cycleFrac);

          const damp = state.reducedMotion ? 1 : 0.12;
          this.spherical.radius += (this.desiredSpherical.radius - this.spherical.radius) * damp;
          this.spherical.theta += (this.desiredSpherical.theta - this.spherical.theta) * damp;
          this.spherical.phi += (this.desiredSpherical.phi - this.spherical.phi) * damp;
          this.updateCamera();
          this.renderer.render(this.scene, this.camera);

          // Throttled UI sync (only on phase transition or every 180ms — no per-frame DOM thrash)
          const phase = this.getCurrentPhaseInfo(cycleFrac);
          if (phase.id !== this.lastPhaseId || (ts - this.lastUiSyncTs) > 180) {
            this.lastPhaseId = phase.id;
            this.lastUiSyncTs = ts;
            this.uiCallbacks?.onTick?.({ simTime: this.simTime, cycleFrac, phase });
          }
        };
        this.animFrameId = requestAnimationFrame(loop);
      }

      reset() { this.simTime = 0; this.lastPhaseId = ''; }

      bindEvents() {
        const dom = this.renderer.domElement;
        dom.style.touchAction = 'none';
        this._pd = (e) => { this.isDragging = true; this.lastPointer = { x: e.clientX, y: e.clientY }; };
        this._pm = (e) => {
          if (!this.isDragging) return;
          this.desiredSpherical.theta -= (e.clientX - this.lastPointer.x) * 0.0085;
          this.desiredSpherical.phi = Math.max(0.25, Math.min(Math.PI - 0.25, this.desiredSpherical.phi - (e.clientY - this.lastPointer.y) * 0.0085));
          this.lastPointer = { x: e.clientX, y: e.clientY };
        };
        this._pu = () => { this.isDragging = false; };
        this._wh = (e) => { e.preventDefault(); this.desiredSpherical.radius = Math.max(2.6, Math.min(11, this.desiredSpherical.radius + e.deltaY * 0.0035)); };
        dom.addEventListener('pointerdown', this._pd);
        window.addEventListener('pointermove', this._pm);
        window.addEventListener('pointerup', this._pu);
        dom.addEventListener('wheel', this._wh, { passive: false });
      }

      resize() {
        if (this.disposed || !this.renderer) return;
        const rect = this.container.getBoundingClientRect();
        const w = Math.max(Math.round(rect.width), 260), h = Math.max(Math.round(rect.height), 220);
        this.camera.aspect = w / h; this.camera.updateProjectionMatrix();
        this.renderer.setSize(w, h, false);
      }

      dispose() {
        this.disposed = true;
        if (this._ro) { this._ro.disconnect(); this._ro = null; }
        if (this.animFrameId) cancelAnimationFrame(this.animFrameId);
        this.clearLabRoot();
        if (this.renderer?.domElement) {
          this.renderer.domElement.removeEventListener('pointerdown', this._pd);
          this.renderer.domElement.removeEventListener('wheel', this._wh);
          this.renderer.dispose();
        }
        window.removeEventListener('pointermove', this._pm);
        window.removeEventListener('pointerup', this._pu);
      }
    }

    function openPhysiologyLab(systemId) {
      state.physio.systemId = systemId;
      const firstScenario = SIMULATION_SCENARIOS.find(sc => sc.systemId === systemId);
      if (firstScenario) {
        state.physio.scenarioId = firstScenario.id;
        Object.assign(state.physio, firstScenario.params || {});
      }
      navigate('physiology');
    }

    // ---------- PHASE 04: SYNCHRONIZED NORMAL VS DISEASED 3D COMPARISON ENGINE ----------
    class PathologyCompareViewer {
      constructor(normalEl, diseaseEl, diseaseId) {
        this.normalEl = normalEl;
        this.diseaseEl = diseaseEl;
        this.diseaseId = diseaseId;
        this.disposed = false;
        this.animId = null;
        this.camA = { radius: 4.8, theta: 0.28, phi: 1.45 };
        this.camB = { radius: 4.8, theta: 0.28, phi: 1.45 };
        this.dragging = null;
        this.lastPtr = { x: 0, y: 0 };
        this.init();
      }

      createViewport(el, isDiseased) {
        const rect = el.getBoundingClientRect();
        const w = Math.max(Math.round(rect.width), 240), h = Math.max(Math.round(rect.height), 220);
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(isDiseased ? 0x0d0b1a : 0x061022);
        const camera = new THREE.PerspectiveCamera(42, w / h, 0.1, 80);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.setSize(w, h, false);
        renderer.domElement.style.width = '100%'; renderer.domElement.style.height = '100%'; renderer.domElement.style.display = 'block';
        el.innerHTML = ''; el.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xdbeafe, 0.65));
        const l1 = new THREE.DirectionalLight(0xffffff, 1.2); l1.position.set(4, 6, 5); scene.add(l1);
        const l2 = new THREE.DirectionalLight(isDiseased ? 0xf43f5e : 0x22d3ee, 0.7); l2.position.set(-4, 2, -4); scene.add(l2);

        const group = new THREE.Group();
        const d = this.diseaseId;
        if (['cad', 'mi'].includes(d)) {
          // Conceptual Coronary Artery Lumen Comparison (Normal Open vs Plaque Narrowing)
          const wall = new THREE.Mesh(new THREE.CylinderGeometry(0.95, 0.95, 2.8, 32, 1, true), new THREE.MeshStandardMaterial({ color: 0xe11d48, side: THREE.DoubleSide, transparent: true, opacity: 0.45 }));
          wall.rotation.z = Math.PI / 2; group.add(wall);
          const lumen = new THREE.Mesh(new THREE.CylinderGeometry(isDiseased ? 0.34 : 0.78, isDiseased ? 0.34 : 0.78, 2.75, 28), new THREE.MeshStandardMaterial({ color: 0xef4444, transparent: true, opacity: 0.75 }));
          lumen.rotation.z = Math.PI / 2; group.add(lumen);
          if (isDiseased) {
            const plaque = new THREE.Mesh(new THREE.SphereGeometry(0.68, 24, 18), new THREE.MeshStandardMaterial({ color: 0xfacc15, roughness: 0.5 }));

          }

          const outer = new THREE.Mesh(new THREE.TorusGeometry(1.15, isDiseased ? 0.42 : 0.22, 20, 36), new THREE.MeshStandardMaterial({ color: isDiseased ? 0xf43f5e : 0x38bdf8, roughness: 0.4 }));

          kidney.scale.set(0.75, 1.32, 0.65); group.add(kidney);
        } else if (d === 'stroke') {
          const brain = new THREE.Mesh(new THREE.SphereGeometry(1.18, 28, 22), new THREE.MeshStandardMaterial({ color: 0xf472b6, roughness: 0.45 }));
          brain.scale.set(1.1, 0.92, 1.0); group.add(brain);
          if (isDiseased) {
            const zone = new THREE.Mesh(new THREE.SphereGeometry(0.42, 20, 16), new THREE.MeshStandardMaterial({ color: 0xef4444, emissive: 0xef4444, emissiveIntensity: 0.5 }));
            zone.position.set(0.68, 0.32, 0.55); group.add(zone);
          }
        } else {
          // Ventricular / Organ schematic comparison (Hypertension LV thickening / Heart Failure / GI)
          const heart = new THREE.Mesh(new THREE.SphereGeometry(isDiseased ? 1.24 : 1.02, 28, 22), new THREE.MeshStandardMaterial({ color: isDiseased ? 0xbe123c : 0xe11d48, roughness: 0.42 }));
          heart.scale.set(0.92, 1.25, 0.86); group.add(heart);
          if (isDiseased) {
            const ring = new THREE.Mesh(new THREE.TorusGeometry(1.15, 0.08, 12, 32), new THREE.MeshStandardMaterial({ color: 0xf59e0b, emissive: 0xf59e0b, emissiveIntensity: 0.35 }));
            ring.rotation.x = Math.PI / 2; group.add(ring);
          }

        scene.add(group);

      init() {
        if (typeof THREE === 'undefined') return;
        this.vpA = this.createViewport(this.normalEl, false);
        this.vpB = this.createViewport(this.diseaseEl, true);
        const bind = (vp, key) => {
          const dom = vp.renderer.domElement;
          dom.style.touchAction = 'none';
          dom.addEventListener('pointerdown', (e) => { this.dragging = key; this.lastPtr = { x: e.clientX, y: e.clientY }; });
          dom.addEventListener('wheel', (e) => {
            e.preventDefault();
            const c = key === 'A' ? this.camA : this.camB;
            c.radius = Math.max(2.5, Math.min(9, c.radius + e.deltaY * 0.003));
            if (state.patho.syncCameras) { this.camA.radius = this.camB.radius = c.radius; }
          }, { passive: false });
        };
        bind(this.vpA, 'A'); bind(this.vpB, 'B');
        this._pm = (e) => {
          if (!this.dragging) return;
          const dx = e.clientX - this.lastPtr.x, dy = e.clientY - this.lastPtr.y;
          this.lastPtr = { x: e.clientX, y: e.clientY };
          const update = (c) => { c.theta -= dx * 0.009; c.phi = Math.max(0.25, Math.min(Math.PI - 0.25, c.phi - dy * 0.009)); };
          if (state.patho.syncCameras) { update(this.camA); this.camB = { ...this.camA }; }
          else { update(this.dragging === 'A' ? this.camA : this.camB); }
        };
        this._pu = () => { this.dragging = null; };
        window.addEventListener('pointermove', this._pm);
        window.addEventListener('pointerup', this._pu);

        const loop = () => {
          if (this.disposed) return;
          this.animId = requestAnimationFrame(loop);
          [[this.vpA, this.camA], [this.vpB, this.camB]].forEach(([vp, c]) => {
            const s = Math.sin(c.phi);
            vp.camera.position.set(c.radius * s * Math.sin(c.theta), c.radius * Math.cos(c.phi), c.radius * s * Math.cos(c.theta));
            vp.camera.lookAt(0, 0, 0);
            vp.renderer.render(vp.scene, vp.camera);
          });
        };
        this.animId = requestAnimationFrame(loop);
      }

      reset() { this.camA = { radius: 4.8, theta: 0.28, phi: 1.45 }; this.camB = { ...this.camA }; }

      dispose() {
        this.disposed = true;
        if (this.animId) cancelAnimationFrame(this.animId);
        window.removeEventListener('pointermove', this._pm);
        window.removeEventListener('pointerup', this._pu);
        [this.vpA, this.vpB].forEach(vp => vp?.renderer?.dispose());
      }
    }

    // ---------- PHASE 05: 3D DRUG MECHANISM SCHEMATIC VIEWER ----------
    class PharmMechanismViewer {
      constructor(el) {
        this.el = el; this.disposed = false; this.animId = null; this.t = 0;
        this.init();
      }
      init() {
        if (typeof THREE === 'undefined') return;
        const rect = this.el.getBoundingClientRect();
        const w = Math.max(Math.round(rect.width), 280), h = Math.max(Math.round(rect.height), 240);
        this.scene = new THREE.Scene(); this.scene.background = new THREE.Color(0x061022);
        this.camera = new THREE.PerspectiveCamera(42, w / h, 0.1, 80);
        this.camera.position.set(0, 1.2, 5.2); this.camera.lookAt(0, 0, 0);
        this.renderer = new THREE.WebGLRenderer({ antialias: true });
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        this.renderer.setSize(w, h, false);
        this.renderer.domElement.style.width = '100%'; this.renderer.domElement.style.height = '100%'; this.renderer.domElement.style.display = 'block';
        this.el.innerHTML = ''; this.el.appendChild(this.renderer.domElement);

        this.scene.add(new THREE.AmbientLight(0xdbeafe, 0.65));
        const l = new THREE.DirectionalLight(0xffffff, 1.25); l.position.set(4, 6, 5); this.scene.add(l);

        // Lipid Membrane Plane + Transmembrane Receptor Target + Drug Molecule + Endogenous Ligand
        const mem = new THREE.Mesh(new THREE.BoxGeometry(5.5, 0.35, 2.2), new THREE.MeshStandardMaterial({ color: 0x1e3a5f, transparent: true, opacity: 0.6 }));
        mem.position.set(0, -0.35, 0); this.scene.add(mem);
        this.receptor = new THREE.Mesh(new THREE.CylinderGeometry(0.65, 0.55, 1.45, 24), new THREE.MeshStandardMaterial({ color: 0x14b8a6, roughness: 0.35 }));
        this.receptor.position.set(0, 0, 0); this.scene.add(this.receptor);
        this.drug = new THREE.Mesh(new THREE.DodecahedronGeometry(0.36, 0), new THREE.MeshStandardMaterial({ color: 0x22d3ee, emissive: 0x06b6d4, emissiveIntensity: 0.4 }));
        this.scene.add(this.drug);
        this.signal = new THREE.Mesh(new THREE.SphereGeometry(0.22, 16, 14), new THREE.MeshStandardMaterial({ color: 0xfacc15, emissive: 0xfacc15, emissiveIntensity: 0.5 }));
        this.scene.add(this.signal);

        const loop = () => {
          if (this.disposed) return;
          this.animId = requestAnimationFrame(loop);
          if (state.pharm.mechPlaying && !state.reducedMotion) this.t += 0.018;
          const cyc = (this.t % 4) / 4;
          const m = state.pharm.mechType;
          // Drug approaches & binds receptor pocket
          const approach = Math.min(1, cyc * 2.2);
          this.drug.position.set(-1.8 * (1 - approach), 1.45 - 0.55 * approach, 0);
          this.drug.rotation.y += 0.02;
          // Intracellular downstream signal (active for agonist, blocked/dimmed for antagonist/enzyme/channel blocker)
          const activeSig = m === 'agonist' && approach > 0.8;
          this.signal.visible = activeSig;
          this.signal.position.set(0, -0.85 - ((cyc * 2) % 1) * 1.1, 0);
          this.receptor.material.color.setHex(m === 'agonist' ? 0x2dd4bf : m === 'enzyme' ? 0xf59e0b : m === 'channel' ? 0x38bdf8 : 0xf43f5e);
          this.renderer.render(this.scene, this.camera);
        };
        this.animId = requestAnimationFrame(loop);
      }
      dispose() { this.disposed = true; if (this.animId) cancelAnimationFrame(this.animId); this.renderer?.dispose(); }
    }

    function drawPkCurve() {
      const cvs = document.getElementById('pk-curve-canvas');
      if (!cvs) return;
      const ctx = cvs.getContext('2d'), w = cvs.width, h = cvs.height;
      ctx.fillStyle = '#050c1a'; ctx.fillRect(0, 0, w, h);
      const tHalf = state.pharm.pkHalfLifeHours;
      const k = Math.LN2 / tHalf;
      const c0 = state.pharm.pkDoseUnits;
      ctx.strokeStyle = '#22d3ee'; ctx.lineWidth = 2.4; ctx.beginPath();
      for (let px = 0; px <= w; px += 3) {
        const tHr = (px / w) * 24;
        const c = c0 * Math.exp(-k * tHr);
        const y = h - 18 - (c / 120) * (h - 32);
        if (px === 0) ctx.moveTo(px, y); else ctx.lineTo(px, y);
      }
      ctx.stroke();
      ctx.fillStyle = '#94a3b8'; ctx.font = '11px monospace';
      ctx.fillText(`C(t) = C0 * e^(-ln(2)/t1/2 * t)  |  t1/2 = ${tHalf}h  |  k = ${k.toFixed(3)} h^-1 (Conceptual 1-Compartment)`, 12, 18);
    }

    function drawPdCurve() {
      const cvs = document.getElementById('pd-curve-canvas');
      if (!cvs) return;
      const ctx = cvs.getContext('2d'), w = cvs.width, h = cvs.height;
      ctx.fillStyle = '#050c1a'; ctx.fillRect(0, 0, w, h);
      const ec50 = state.pharm.pdEC50;
      const shift = 1 + state.pharm.pdAntagonistConc / 25;
      const plot = (emax, effEc50, color) => {
        ctx.strokeStyle = color; ctx.lineWidth = 2.2; ctx.beginPath();
        for (let px = 0; px <= w; px += 3) {
          const conc = Math.pow(10, (px / w) * 3 - 0.5);
          const eff = (emax * conc) / (effEc50 + conc);
          const y = h - 18 - (eff / 110) * (h - 34);
          if (px === 0) ctx.moveTo(px, y); else ctx.lineTo(px, y);
        }
        ctx.stroke();
      };
      plot(100, ec50, '#22d3ee'); // Full Agonist
      plot(60, ec50, '#f59e0b');  // Partial Agonist
      if (state.pharm.pdAntagonistConc > 0) plot(100, ec50 * shift, '#f43f5e'); // + Competitive Antagonist
      ctx.fillStyle = '#94a3b8'; ctx.font = '11px monospace';
      ctx.fillText(`Hill Model: E = (Emax*C)/(EC50+C) | Cyan: Full Agonist | Amber: Partial | Rose: +Antagonist`, 12, 18);
    }

    function runUnifiedMedicalSearch(rawQuery) {
      const q = (rawQuery || '').trim().toLowerCase();
      if (!q) return [];
      const hits = [];
      ANATOMY_STRUCTURES.forEach(item => {
        if (item.englishName.toLowerCase().includes(q) || item.arabicName.includes(q) || item.scientificTerm.toLowerCase().includes(q)) {
          hits.push({ kind: 'Anatomy', id: item.id, titleEn: item.englishName, titleAr: item.arabicName, snippetEn: item.descriptionEn, snippetAr: item.descriptionAr, refs: item.references, action: () => navigate('anatomy', { structureId: item.id }) });
        }
      });
      DISEASE_LIBRARY.forEach(d => {
        if (d.englishName.toLowerCase().includes(q) || d.arabicName.includes(q) || d.synonyms.some(x => x.toLowerCase().includes(q))) {
          hits.push({ kind: 'Pathology', id: d.id, titleEn: d.englishName, titleAr: d.arabicName, snippetEn: d.overviewEn, snippetAr: d.overviewAr, refs: d.refs, action: () => { state.patho.selectedDiseaseId = d.id; state.patho.subView = 'library'; navigate('pathology'); } });
        }
      });
      DRUG_LIBRARY.forEach(dr => {
        if (dr.genericEn.toLowerCase().includes(q) || dr.genericAr.includes(q) || dr.classId.includes(q)) {
          hits.push({ kind: 'Pharmacology', id: dr.id, titleEn: dr.genericEn, titleAr: dr.genericAr, snippetEn: dr.mechEn, snippetAr: dr.mechAr, refs: dr.refs, action: () => { state.pharm.selectedDrugId = dr.id; state.pharm.subView = 'library'; navigate('pharmacology'); } });
        }

      return hits;

    function detectEmergencyRedFlag(text) {
      const low = text.toLowerCase();
      const flags = ['chest pain', 'can\'t breathe', 'cannot breathe', 'stroke', 'suicide', 'overdose', 'unconscious', 'severe bleeding', 'ألم صدر شديد', 'لا أستطيع التنفس', 'جلطة الآن', 'نزيف حاد', 'فقدان وعي'];
      return flags.some(f => low.includes(f));
    }

    async function askAiMedicalTutor(userQuestion) {
      const cleanQ = userQuestion.trim();
      if (!cleanQ) return;
      state.tutor.messages.push({ role: 'user', text: cleanQ });
      state.tutor.busy = true;
      renderTutorPage();

      // Safety boundary check (Section 06)
      if (detectEmergencyRedFlag(cleanQ)) {
        state.tutor.messages.push({
          role: 'assistant',
          isEmergency: true,
          text: state.lang === 'ar'
            ? 'تنبيه طوارئ طبية: إذا كنت أنت أو أي شخص آخر تعانون من أعراض حادة مثل ألم الصدر الشديد أو ضيق التنفس المفاجئ أو أعراض السكتة الدماغية، يرجى طلب الرعاية الإسعافية المحلية فوراً. منصة MEDVERSE 3D تعليمية فقط ولا تقدم تشخيصاً أو إسعافاً طبياً.'
            : 'URGENT MEDICAL SAFETY NOTICE: If you or someone else is experiencing acute warning signs (such as chest pain, sudden shortness of breath, stroke symptoms, or severe bleeding), seek immediate local emergency medical care. MEDVERSE 3D is an educational platform only and cannot diagnose or triage emergencies.',
          citations: []
        });
        state.tutor.busy = false;
        renderTutorPage();
        return;
      }

      // Grounded RAG Retrieval from Verified Internal Knowledge Graph (Section 05)
      const tokens = cleanQ.split(/[\s,?.!؟،]+/).filter(w => w.length >= 2);
      let retrieved = [];
      tokens.forEach(tk => {
        runUnifiedMedicalSearch(tk).forEach(h => {
          if (!retrieved.some(r => r.kind === h.kind && r.id === h.id)) retrieved.push(h);
        });
      });
      // Context-aware fallback to currently selected organ
      if (!retrieved.length) {
        const curOrgan = ANATOMY_STRUCTURES.find(x => x.id === state.selectedStructureId);
        if (curOrgan) retrieved.push({ kind: 'Anatomy', id: curOrgan.id, titleEn: curOrgan.englishName, titleAr: curOrgan.arabicName, snippetEn: curOrgan.descriptionEn, snippetAr: curOrgan.descriptionAr, refs: curOrgan.references, action: () => navigate('anatomy', { structureId: curOrgan.id }) });
      }

      // Attempt secure server-side Vercel Gemini endpoint (/api/tutor) if deployed; fallback cleanly to Local Grounded RAG
      let replyText = '';
      let usedRemoteApi = false;
      try {
        if (window.location.protocol.startsWith('http') && !window.location.hostname.includes('unused')) {
          const resp = await fetch('/api/tutor', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              question: cleanQ,
              lang: state.lang,
              mode: state.tutor.mode,
              contextRecords: retrieved.slice(0, 3).map(r => ({ kind: r.kind, titleEn: r.titleEn, titleAr: r.titleAr, snippetEn: r.snippetEn, snippetAr: r.snippetAr }))
            })
          });
          if (resp.ok) {
            const data = await resp.json();
            if (data && data.answer) { replyText = data.answer; usedRemoteApi = true; }
          }
        }
      } catch {}

      const top = retrieved.slice(0, 3);
      const citations = [];
      top.forEach(item => (item.refs || []).slice(0, 2).forEach(rid => {
        const ref = VERIFIED_REFERENCES[rid];
        if (ref && !citations.some(c => c.url === ref.url)) citations.push(ref);
      }));

      if (!usedRemoteApi) {
        if (top.length) {
          const lines = top.map(r => state.lang === 'ar'
            ? `• ${r.titleAr} (${r.titleEn}) [${r.kind}]: ${r.snippetAr}`
            : `• ${r.titleEn} (${r.titleAr}) [${r.kind}]: ${r.snippetEn}`
          ).join('\n\n');
          replyText = (state.lang === 'ar'
            ? `إجابة تعليمية موثقة من قاعدة بيانات MEDVERSE 3D:\n\n${lines}\n\nملاحظة: هذه المعلومات للتعليم الطبي فقط ولا تغني عن استشارة الطبيب.`
            : `Grounded Educational Response from MEDVERSE 3D Knowledge Base:\n\n${lines}\n\nNote: Educational content only — not individualized medical advice or diagnosis.`);
        } else {
          replyText = state.lang === 'ar'
            ? 'لم أجد سجلاً موثقاً مطابقاً لهذا السؤال في قاعدة بيانات المرحلة 06 الحالية. جرّب السؤال عن أحد الأعضاء الـ 16 أو الأمراض الـ 12 أو الأدوية المدرجة (مثل: القلب، ارتفاع ضغط الدم، Lisinopril، الربو).'
            : 'No verified record matching this query was found in the current Phase 06 knowledge base. Try asking about one of the 16 core organs, 12 diseases, or curated drug classes (e.g., Heart, Hypertension, Lisinopril, Asthma, Nephron).';
        }
      }

      state.tutor.messages.push({
        role: 'assistant',
        text: replyText,
        citations,
        toolActions: top.map(r => ({ label: (state.lang === 'ar' ? 'فتح في المنصة: ' + r.titleAr : 'Open in Atlas: ' + r.titleEn), run: r.action })),
        engineTag: usedRemoteApi ? 'Gemini API (/api/tutor) + RAG' : 'Local Grounded RAG Engine'
      });
      recordActivity('AI Tutor', 'Asked AI Tutor: ' + cleanQ.slice(0, 42), 'سؤال للمعلم الذكي: ' + cleanQ.slice(0, 42));
      state.tutor.busy = false;
      renderTutorPage();
    }

          status: 'DRAFT', author: state.cms.role, updatedAt: new Date().toISOString().slice(0, 10)
        });
        saveStored('medverse_cms_drafts', state.cms.drafts);
        renderAdminCmsPage();
        showToast('Draft saved to editorial queue.', 'success');
      });
      document.querySelectorAll('[data-cms-next]').forEach(b => b.addEventListener('click', () => {
        const [id, nextStatus] = b.dataset.cmsNext.split(':');
        const item = state.cms.drafts.find(x => x.id === id);
        if (item) { item.status = nextStatus; saveStored('medverse_cms_drafts', state.cms.drafts); renderAdminCmsPage(); }
      }));
    }

    function renderApp() {
      cleanupViewers();
      renderShellChrome();
      if (state.page === 'home') renderHomePage();
      else if (state.page === 'anatomy') renderAnatomyPage();
      else if (state.page === 'dictionary') renderDictionaryPage();
      else if (state.page === 'learning') renderLearningPage();
      else if (state.page === 'about') renderAboutPage();
      else if (state.page === 'physiology') renderPhysiologyLabPage();
      else if (state.page === 'pathology') renderPathologyPage();
      else if (state.page === 'pharmacology') renderPharmacologyPage();
      else if (state.page === 'tutor') renderTutorPage();
      else if (state.page === 'mylearning') renderMyLearningPage();
      else if (state.page === 'admin') renderAdminCmsPage();
      else renderFutureSimulationPage(state.page);
      if (window.lucide) lucide.createIcons();
    }

    // ---------- 14. GLOBAL CONTROLS & BOOTSTRAP ----------
    document.getElementById('brand-home-btn').addEventListener('click', () => navigate('home'));
    document.getElementById('lang-toggle-btn').addEventListener('click', () => {
      state.lang = state.lang === 'en' ? 'ar' : 'en';
      saveStored('medverse_lang', state.lang);
      renderApp();
    });
    document.getElementById('reduced-motion-btn').addEventListener('click', () => {
      state.reducedMotion = !state.reducedMotion;
      saveStored('medverse_reduced_motion', state.reducedMotion);
      renderShellChrome();
      if (window.lucide) lucide.createIcons();
    });
    document.querySelectorAll('[data-text-size]').forEach(btn => {
      btn.addEventListener('click', () => {
        state.textSize = btn.dataset.textSize;
        saveStored('medverse_text_size', state.textSize);
        renderShellChrome();
        if (state.page === 'anatomy') renderAnatomyDetailPanel();
      });
    });
    document.getElementById('mobile-menu-btn').addEventListener('click', () => {
      document.getElementById('mobile-nav-drawer').classList.toggle('hidden');
    });
    window.addEventListener('keydown', (e) => {
      if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName)) return;
      if (state.page === 'anatomy' && activeExplorerViewer) {
        const k = e.key.toLowerCase();
        if (k === 'r') activeExplorerViewer.setCameraPreset('reset');
        if (k === '1') activeExplorerViewer.setCameraPreset('front');
        if (k === '2') activeExplorerViewer.setCameraPreset('rear');
        if (k === '3') activeExplorerViewer.setCameraPreset('left');
        if (k === '4') activeExplorerViewer.setCameraPreset('right');
        if (k === '5') activeExplorerViewer.setCameraPreset('superior');
        if (k === '6') activeExplorerViewer.setCameraPreset('inferior');
      }
    });
    window.addEventListener('DOMContentLoaded', () => renderApp());
  </script>
</body>
</html>
